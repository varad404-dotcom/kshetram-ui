<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kshetram Cricket Academy ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,500;1,600&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="app">
  <header class="topbar">
    <svg class="art" viewBox="0 0 1200 110" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fb9ea"/><stop offset=".7" stop-color="#dcefff"/><stop offset="1" stop-color="#f6fbff"/></linearGradient>
        <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fb23a"/><stop offset="1" stop-color="#3d8a22"/></linearGradient>
        <pattern id="crowd" width="7" height="6" patternUnits="userSpaceOnUse"><rect width="7" height="6" fill="#3e5f6b"/><circle cx="2" cy="2" r="1.4" fill="#e8b84a"/><circle cx="5.5" cy="4.5" r="1.3" fill="#d86a4a"/><circle cx="5" cy="1.5" r="1" fill="#9fd1e8"/></pattern>
      </defs>
      <rect width="1200" height="110" fill="url(#sky)"/>
      <ellipse cx="420" cy="26" rx="70" ry="12" fill="#fff" opacity=".8"/><ellipse cx="470" cy="20" rx="46" ry="10" fill="#fff" opacity=".9"/>
      <ellipse cx="900" cy="22" rx="80" ry="11" fill="#fff" opacity=".8"/><ellipse cx="1100" cy="34" rx="60" ry="9" fill="#fff" opacity=".7"/>
      <path d="M330 78 L400 40 L800 40 L880 78 Z" fill="url(#crowd)"/>
      <path d="M330 78 L400 40 L800 40 L880 78 L880 84 L330 84Z" fill="none"/>
      <rect x="400" y="34" width="400" height="7" fill="#e9eef0"/>
      <g stroke="#cfd8dc" stroke-width="2"><path d="M420 34v-14M520 34v-16M690 34v-16M780 34v-14"/></g>
      <g fill="#fff"><rect x="410" y="14" width="22" height="7" rx="2"/><rect x="510" y="10" width="22" height="7" rx="2"/><rect x="680" y="10" width="22" height="7" rx="2"/><rect x="770" y="14" width="22" height="7" rx="2"/></g>
      <path d="M0 84 L1200 84 L1200 110 L0 110Z" fill="url(#grass)"/>
      <path d="M330 78 L880 78 L880 86 L330 86Z" fill="#4c9a2c"/>
      <path d="M560 84 L640 84 L690 110 L510 110Z" fill="#d9bd86"/>
      <rect x="592" y="80" width="16" height="6" fill="#fff" opacity=".9"/>
    </svg>
    <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div class="brand">
      <div class="mark"><svg width="56" height="82" viewBox="0 0 56 82" fill="#fff" aria-hidden="true"><circle cx="30" cy="9" r="6.5"/><path d="M22 18c5-3 12-2 15 3l5 14-9 5 3 10-8 22h-6l4-20-9 18H9l11-24 2-19-4 6-6-3z"/><rect x="38" y="6" width="5" height="40" rx="2.5" transform="rotate(25 40 26)"/><circle cx="12" cy="30" r="4.5" fill="#d33"/></svg></div>
      <div class="name"><b>KSHETRAM</b><span>CRICKET ACADEMY</span><i>ERP</i></div>
    </div>
    <div class="tag">Discipline. Practice. Progress.</div>
    <label class="search"><span class="sr">Search players or batches</span><input id="gsearch" type="search" placeholder="Search players, batches, fees…" autocomplete="off"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></label>
    <div class="top-actions">
      <button class="bell" id="bell" aria-label="Notifications"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 22a2.4 2.4 0 0 0 2.4-2.4h-4.8A2.4 2.4 0 0 0 12 22zm7-6.5V11a7 7 0 0 0-5.5-6.8V3.5a1.5 1.5 0 0 0-3 0v.7A7 7 0 0 0 5 11v4.5l-2 2V19h18v-1.5z"/></svg><span class="badge" id="bellBadge">0</span></button>
      <button class="me" id="me" aria-label="Account: Admin Administrator"><span class="av" style="width:36px;height:36px;background:#c9d4dc"><svg width="30" height="30" viewBox="0 0 24 24" fill="#33414b"><circle cx="12" cy="9" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg></span><div><b>Admin</b><small>Administrator</small></div></button>
    </div>
  </header>

  <aside class="side" id="side" aria-label="Main">
    <nav id="nav"></nav>
    <div class="quote"><svg width="110" height="130" viewBox="0 0 56 82" fill="#fff" aria-hidden="true"><circle cx="30" cy="9" r="6.5"/><path d="M22 18c5-3 12-2 15 3l5 14-9 5 3 10-8 22h-6l4-20-9 18H9l11-24 2-19-4 6-6-3z"/><rect x="38" y="6" width="5" height="40" rx="2.5" transform="rotate(25 40 26)"/></svg>Better Players Build Brighter Futures<u></u></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main id="main" tabindex="-1"><div class="view" id="view"></div></main>
</div>

<dialog id="dlg"><form id="dlgForm" method="dialog" novalidate></form></dialog>
<div id="printArea"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
